name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        mcp: ["mcp<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool xterm
      - name: Install
        run: pip install "${{ matrix.mcp }}" -e ".[dev]"
      - name: Tests (unit + live X11 end-to-end)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest -v
